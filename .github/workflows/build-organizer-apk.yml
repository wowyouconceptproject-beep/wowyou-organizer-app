name: Build Organizer APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          cache: true

      - name: Install Android SDK Components
        uses: android-actions/setup-android@v3

      - name: Install Required Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          sdkmanager --licenses

      - name: Verify Android NDK
        run: |
          test -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          test -f "$ANDROID_SDK_ROOT/ndk/27.0.12077973/source.properties"
          cat "$ANDROID_SDK_ROOT/ndk/27.0.12077973/source.properties"

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: organizer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error